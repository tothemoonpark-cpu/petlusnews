name: 펫러스뉴스 자동 게재
on:
  schedule:
    - cron: '5 15 * * *'   # 한국 00:05
    - cron: '35 17 * * *'  # 한국 02:35 (재시도)
    - cron: '5 21 * * *'   # 한국 06:05 (재시도)
  workflow_dispatch:
    inputs:
      today:
        description: '시험용 날짜 YYYY-MM-DD (비우면 한국 오늘)'
        required: false
permissions:
  contents: write
  pages: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PN_TODAY: ${{ github.event.inputs.today }}
    steps:
      - uses: actions/checkout@v4
      - name: 검수 통과 기사만 게재
        id: pub
        run: |
          set +e
          python3 _src/publish.py --root .
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 커밋과 푸시
        if: steps.pub.outputs.code == '0' || steps.pub.outputs.code == '10'
        run: |
          git config user.name "petlusnews-bot"
          git config user.email "petlusnews-bot@users.noreply.github.com"
          echo "$(date -u +%FT%TZ) run ${{ github.run_id }}" > _src/last_run.txt
          git add -A
          git commit -m "자동 게재 $(TZ=Asia/Seoul date +%F) (run ${{ github.run_id }})" || echo "변경 없음"
          git push
      - name: 사이트 빌드 요청
        if: steps.pub.outputs.code == '0' || steps.pub.outputs.code == '10'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
      - name: 라이브 feed에 오늘 날짜가 올라왔는지 확인 (최대 15분)
        if: steps.pub.outputs.code == '0' || steps.pub.outputs.code == '10'
        run: |
          TODAY="${PN_TODAY:-$(TZ=Asia/Seoul date +%F)}"
          for i in $(seq 1 30); do
            if curl -s https://petlusnews.com/feed.xml | grep -q "<pubDate>${TODAY}<"; then echo "라이브 확인: ${TODAY}"; exit 0; fi
            sleep 30
          done
          echo "라이브 feed에 ${TODAY} 없음"; exit 1
      - name: 결과 판정 (문제가 있으면 실패 표시와 알림)
        if: always()
        run: |
          code="${{ steps.pub.outputs.code }}"
          if [ "$code" = "0" ]; then echo "정상"; exit 0; fi
          echo "게재 결과 코드 $code (1=치명적 문제, 10=검수 안 된 큐 기사 있음). 요약 탭 참고"; exit 1
